name: CI

# Runs on every push to dev and main, and on every pull request.
on:
  push:
    branches: [dev, main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      # Build must precede the tests: the path-traversal test in test/server.test.mjs skips without dist/.
      - run: npm run build
      - run: npm test
